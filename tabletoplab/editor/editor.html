<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create — Tabletop Lab</title>
    <link rel="stylesheet" href="../../docs/index.css">
    <link rel="stylesheet" href="../../docs/nav.css">
    <link rel="stylesheet" href="editor.css">
    <link rel="stylesheet" href="board/board.css">
    <link rel="stylesheet" href="scripting/scripting.css">
    <link rel="stylesheet" href="gamestate/gamestate.css">
    <link rel="stylesheet" href="collections/collections.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../docs/index.html" class="nav-brand">Tabletop Lab</a>
            <ul class="nav-menu">
                <li><a href="../../docs/index.html" class="nav-link">Play</a></li>
                <li><a href="../../docs/about.html" class="nav-link">About</a></li>
                <li><a href="editor.html" class="nav-link active">Create</a></li>
                <li><a href="../../docs/docs.html" class="nav-link">Docs</a></li>
            </ul>
        </div>
    </nav>

    <div id="editor-app">
        <div class="editor-header">
            <div class="editor-title">Game Editor</div>
            <div class="editor-controls">
                <span class="dirty-indicator" id="dirty-indicator"></span>
                <button class="btn btn-sm" id="btn-import">Import</button>
                <button class="btn btn-sm" id="btn-export">Export</button>
            </div>
        </div>

        <div class="editor-tabs">
            <button class="tab-btn active" data-tab="board">Board</button>
            <button class="tab-btn" data-tab="gamestate">Game State</button>
            <button class="tab-btn" data-tab="scripting">Scripting</button>
            <button class="tab-btn" data-tab="collections">Collections</button>
        </div>

        <div class="editor-content">
            <div class="tab-pane active" data-tab="board"       id="pane-board"></div>
            <div class="tab-pane"        data-tab="scripting"   id="pane-scripting"></div>
            <div class="tab-pane"        data-tab="gamestate"   id="pane-gamestate"></div>
            <div class="tab-pane"        data-tab="collections" id="pane-collections"></div>
        </div>
    </div>

    <!-- Load order: config → editor shell → tab modules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="gameConfig.js"></script>
    <script src="board/board.js"></script>
    <script src="scripting/blocks.js"></script>
    <script src="scripting/scripting.js"></script>
    <script src="gamestate/gamestate.js"></script>
    <script src="collections/collections.js"></script>
    <script src="editor.js"></script>
</body>
</html>
