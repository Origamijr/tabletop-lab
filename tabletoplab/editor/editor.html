<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create - Tabletop Lab</title>
    <link rel="stylesheet" href="../../docs/index.css">
    <link rel="stylesheet" href="../../docs/nav.css">
    <link rel="stylesheet" href="editor.css">
    <link rel="stylesheet" href="ui/ui.css">
    <link rel="stylesheet" href="collections/collections.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../docs/index.html" class="nav-brand">Tabletop Lab</a>
            <ul class="nav-menu">
                <li><a href="../../docs/index.html" class="nav-link">Play</a></li>
                <li><a href="../../docs/about.html" class="nav-link">About</a></li>
                <li><a href="editor.html" class="nav-link active">Create</a></li>
                <li><a href="../../docs/docs.html" class="nav-link">Docs</a></li>
            </ul>
        </div>
    </nav>

    <div id="editor-app">
        <!-- Header with import/export buttons -->
        <div class="editor-header">
            <div class="editor-title">Game Editor</div>
            <div class="editor-controls">
                <button class="btn" id="btn-import">Import Game</button>
                <button class="btn btn-primary" id="btn-export">Export Game</button>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="editor-tabs">
            <button class="tab-btn active" data-tab="board">Board</button>
            <button class="tab-btn" data-tab="gamestate">Game State</button>
            <button class="tab-btn" data-tab="scripting">Scripting</button>
            <button class="tab-btn" data-tab="collections">Collections</button>
        </div>

        <!-- Tab Content -->
        <div class="editor-content">
            <!-- Board Tab -->
            <div class="tab-pane active" data-tab="board" id="pane-board"></div>

            <!-- Game State Tab -->
            <div class="tab-pane" data-tab="gamestate" id="pane-gamestate">
                <div class="editor-placeholder">
                    <h2>Game State Editor</h2>
                    <p>Configure states, transitions, and actions</p>
                </div>
            </div>

            <!-- Scripting Tab -->
            <div class="tab-pane" data-tab="scripting" id="pane-scripting">
                <div class="editor-placeholder">
                    <h2>Scripting Editor</h2>
                    <p>Create scripts for game logic</p>
                </div>
            </div>

            <!-- Collections Tab -->
            <div class="tab-pane" data-tab="collections" id="pane-collections"></div>
        </div>
    </div>

    <script src="../../docs/utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="gameConfig.js"></script>
    <script src="editor.js"></script>
    <script src="ui/ui.js"></script>
    <script src="collections/collections.js"></script>
</body>
</html>
