<div class="ui-editor">
    <div class="ui-sidebar">
        <h3>Game Config</h3>
        <div class="form-group">
            <label>Game Name</label>
            <input type="text" id="ui-game-name" placeholder="e.g., Poker">
        </div>
        <div class="form-group">
            <label>Players</label>
            <input type="number" id="ui-players" min="1" max="99" value="2">
        </div>
        <hr>
        <h3>Zones</h3>
        <div id="ui-zones-list"></div>
        <button class="btn" id="btn-add-zone">+ Add Zone</button>
    </div>

    <div class="ui-preview">
        <h3>Grid Preview</h3>
        <div id="ui-grid-preview" class="grid-preview">
            <p class="placeholder">Add zones to preview grid layout</p>
        </div>
    </div>
</div>
