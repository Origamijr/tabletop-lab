<div class="collections-editor">
    <!-- Collection Selector -->
    <div class="collections-tabs">
        <div id="collections-list" class="collections-list"></div>
        <button class="btn" id="btn-add-collection">+ Collection</button>
    </div>

    <!-- CSV Editor -->
    <div class="collections-section">
        <div class="csv-toolbar">
            <button class="btn" id="btn-csv-add-row">+ Row</button>
            <button class="btn" id="btn-csv-add-column">+ Column</button>
            <button class="btn" id="btn-csv-import">Import CSV</button>
            <button class="btn" id="btn-csv-export">Export CSV</button>
        </div>
        <div id="csv-wrap" class="csv-wrap">
            <table id="csv-table">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Render Script Editor -->
    <div class="collections-section">
        <h3>Render Template</h3>
        <div class="render-controls">
            <div class="form-group">
                <label>HTML Template with {{column}} placeholders</label>
                <textarea id="render-script" class="render-textarea" placeholder="&lt;div class='card'&gt;&#10;&lt;h2&gt;{{name}}&lt;/h2&gt;&#10;&lt;p&gt;{{effect}}&lt;/p&gt;&#10;&lt;/div&gt;&#10;&#10;substitutions: {&#10;  '(W)': 'imgs/white.png',&#10;  '(R)': 'imgs/red.png'&#10;}"></textarea>
            </div>
            <button class="btn" id="btn-render-import">Import Template</button>
            <button class="btn" id="btn-render-export">Export Template</button>
        </div>
    </div>

    <!-- Preview/Visual Editor -->
    <div class="collections-section preview-section">
        <h3>Preview</h3>
        <div id="collections-preview" class="collections-preview"></div>
    </div>
</div>
