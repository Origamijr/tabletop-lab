<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Tabletop Lab</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="nav.css">
    <script src="utils.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-brand">Tabletop Lab</a>
            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Play</a></li>
                <li><a href="about.html" class="nav-link active">About</a></li>
                <li><a href="../tabletoplab/editor/editor.html" class="nav-link">Create</a></li>
                <li><a href="docs.html" class="nav-link">Docs</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div id="about-content" class="markdown-content"></div>
    </div>

    <script>
        async function loadAbout() {
            try {
                const response = await fetch('about.md');
                const markdown = await response.text();
                const content = document.getElementById('about-content');
                content.innerHTML = markdownToHtml(markdown);
            } catch (error) {
                document.getElementById('about-content').innerHTML = 
                    '<p class="error">Error loading about page.</p>';
            }
        }

        window.addEventListener('load', loadAbout);
    </script>
</body>
</html>
